<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOA Project Monitoring</title>
<style>
  :root{
    --boa-green:#1B7A4B;
    --boa-green-dark:#145c38;
    --boa-green-light:#e8f5ee;
    --boa-navy:#1B2E5E;
    --boa-navy-dark:#111e3f;
    --boa-navy-light:#e8ecf5;
    --boa-black:#0e0e0e;
    --boa-white:#ffffff;
    --boa-gray-bg:#f7f7f5;
    --boa-gray-surf:#efefec;
    --boa-gray-border:#dcdcd8;
    --boa-gray-text:#6b6b65;
    --boa-red:#c0392b;
    --boa-red-light:#fdf0ef;
    --boa-orange:#d4830a;
    --boa-orange-light:#fdf6e8;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--boa-gray-bg);
    color:var(--boa-black);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ─── Layout ─────────────────────────────────────────────── */
  .layout{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;
    background:var(--boa-navy);
    color:#fff;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .sidebar-header{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar-logo{
    width:36px;height:36px;border-radius:10px;
    background:var(--boa-green);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;flex-shrink:0;
  }
  .sidebar-title{font-weight:700;font-size:15px;line-height:1.2;}
  .sidebar-subtitle{font-size:11px;color:rgba(255,255,255,.55);}

  .sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;
    color:rgba(255,255,255,.75);
    text-decoration:none;font-size:13.5px;font-weight:500;
    cursor:pointer;border:none;background:none;width:100%;text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--boa-green);color:#fff;}
  .nav-item svg{flex-shrink:0;}

  .sidebar-footer{
    padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);
    font-size:11.5px;color:rgba(255,255,255,.5);
  }
  .sidebar-footer strong{display:block;color:rgba(255,255,255,.85);font-size:12.5px;margin-bottom:2px;}

  /* Main */
  .main{flex:1;min-width:0;}
  .topbar{
    background:#fff;border-bottom:1px solid var(--boa-gray-border);
    padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:19px;font-weight:700;color:var(--boa-black);}
  .topbar p{font-size:12.5px;color:var(--boa-gray-text);margin-top:2px;}

  .content{padding:28px 32px;}

  .btn-primary{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:8px;border:none;
    background:var(--boa-green);color:#fff;font-size:13px;font-weight:600;
    cursor:pointer;text-decoration:none;transition:background .15s;
  }
  .btn-primary:hover{background:var(--boa-green-dark);}

  /* ─── KPI cards ──────────────────────────────────────────── */
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}

  .card{
    background:#fff;border:1px solid var(--boa-gray-border);
    border-radius:12px;
  }
  .kpi-card{
    padding:18px;display:flex;align-items:center;gap:14px;
  }
  .kpi-card.alert{border-color:#f5c4bf;}
  .kpi-icon{
    width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .kpi-value{font-size:22px;font-weight:700;color:var(--boa-black);}
  .kpi-card.alert .kpi-value.has-value{color:var(--boa-red);}
  .kpi-label{font-size:12px;color:var(--boa-gray-text);margin-top:2px;}

  .health-card{
    padding:16px;display:flex;align-items:center;gap:14px;
  }
  .health-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .health-dot.green{background:var(--boa-green);box-shadow:0 0 0 4px var(--boa-green-light);}
  .health-dot.orange{background:var(--boa-orange);box-shadow:0 0 0 4px var(--boa-orange-light);}
  .health-dot.red{background:var(--boa-red);box-shadow:0 0 0 4px var(--boa-red-light);}
  .health-value{font-size:20px;font-weight:700;color:var(--boa-black);}
  .health-label{font-size:12.5px;color:var(--boa-gray-text);}

  /* ─── Section headers ────────────────────────────────────── */
  .section{margin-top:28px;}
  .section-card{background:#fff;border:1px solid var(--boa-gray-border);border-radius:12px;overflow:hidden;}
  .section-head{
    padding:14px 18px;border-bottom:1px solid var(--boa-gray-border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-head h2{font-size:13px;font-weight:600;color:#374151;display:flex;align-items:center;gap:8px;}
  .section-head .count{font-size:11.5px;color:#9ca3af;}

  .list-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 18px;border-bottom:1px solid var(--boa-gray-surf);
    text-decoration:none;color:inherit;transition:background .12s;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--boa-gray-bg);}
  .list-row .title{font-size:13.5px;font-weight:600;color:var(--boa-black);}
  .list-row .meta{font-size:11.5px;color:#9ca3af;margin-top:1px;}
  .list-row .flex1{flex:1;min-width:0;}
  .list-row .title,.list-row .meta{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .empty{padding:36px 18px;text-align:center;font-size:13px;color:#9ca3af;}

  /* badges */
  .badge{
    display:inline-flex;align-items:center;padding:3px 8px;
    border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;
  }

  /* ─── Charts (pure CSS) ─────────────────────────────────── */
  .chart-card{padding:20px;}
  .chart-card h2{font-size:13px;font-weight:600;color:#374151;margin-bottom:16px;}

  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut{
    width:140px;height:140px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--donut-stops, #efefec 0 100%));
    position:relative;
  }
  .donut::after{
    content:"";position:absolute;inset:18px;border-radius:50%;background:#fff;
  }
  .legend{display:flex;flex-direction:column;gap:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#374151;}
  .legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}

  .bars{display:flex;flex-direction:column;gap:12px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{width:100px;flex-shrink:0;font-size:12px;color:#374151;text-align:right;}
  .bar-track{flex:1;background:var(--boa-gray-surf);border-radius:6px;height:18px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--boa-green);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;}
  .bar-value{width:28px;flex-shrink:0;font-size:12px;font-weight:600;color:#374151;}

  /* ─── Print ──────────────────────────────────────────────── */
  @media print{
    .sidebar, .topbar, .no-print, #modal-root{display:none !important;}
    .layout, .main, .content{display:block !important;min-height:0;}
    .content{padding:0;}
    body{background:#fff;}
    .card, .section-card, .journal-card{break-inside:avoid;}
  }

  /* ─── Placeholder views ─────────────────────────────────── */
  .placeholder{
    background:#fff;border:1px dashed var(--boa-gray-border);border-radius:12px;
    padding:60px 24px;text-align:center;color:var(--boa-gray-text);font-size:13.5px;
  }

  /* ─── Filters bar ────────────────────────────────────────── */
  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search-wrap{position:relative;flex:1;min-width:220px;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9ca3af;}
  .search-wrap input{
    width:100%;padding:9px 12px 9px 34px;border:1px solid var(--boa-gray-border);
    border-radius:8px;font-size:13px;background:#fff;
  }
  .search-wrap input:focus,.select-wrap select:focus{outline:2px solid var(--boa-green);outline-offset:-1px;}
  .select-wrap{position:relative;}
  .select-wrap select{
    appearance:none;padding:9px 30px 9px 12px;border:1px solid var(--boa-gray-border);
    border-radius:8px;font-size:13px;background:#fff;color:#374151;cursor:pointer;
  }
  .select-wrap svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none;}
  .clear-link{font-size:12px;color:#6b7280;text-decoration:underline;cursor:pointer;background:none;border:none;}

  /* ─── Table ──────────────────────────────────────────────── */
  .table-card{background:#fff;border:1px solid var(--boa-gray-border);border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:var(--boa-gray-bg);border-bottom:1px solid var(--boa-gray-border);}
  th{padding:10px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#9ca3af;font-weight:600;}
  th.right{text-align:right;}
  td{padding:12px 16px;border-bottom:1px solid var(--boa-gray-surf);vertical-align:middle;}
  tbody tr:hover{background:var(--boa-gray-bg);}
  tbody tr:last-child td{border-bottom:none;}
  td .pname{font-weight:600;color:var(--boa-black);}
  td .psub{font-size:11.5px;color:#9ca3af;margin-top:2px;}
  td.right{text-align:right;}
  .health-cell{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;}
  .health-cell .dot{width:8px;height:8px;border-radius:50%;}

  /* ─── Progress bar ───────────────────────────────────────── */
  .progress-track{background:var(--boa-gray-surf);border-radius:6px;height:8px;width:100%;overflow:hidden;}
  .progress-fill{height:100%;background:var(--boa-green);border-radius:6px;}
  .progress-label{font-size:11px;color:#6b7280;margin-top:3px;}

  /* ─── Action icon buttons ────────────────────────────────── */
  .icon-btn{padding:6px;border-radius:6px;border:none;background:none;cursor:pointer;color:#6b7280;display:inline-flex;}
  .icon-btn:hover{background:var(--boa-gray-bg);color:var(--boa-green);}
  .icon-btn.danger:hover{background:var(--boa-red-light);color:var(--boa-red);}

  /* ─── Modal ──────────────────────────────────────────────── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-card{background:#fff;border-radius:12px;padding:24px;max-width:380px;width:100%;}
  .modal-card h3{font-size:15px;font-weight:700;color:var(--boa-black);margin-bottom:8px;}
  .modal-card p{font-size:13px;color:#6b7280;margin-bottom:20px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .btn-outline{padding:8px 16px;border-radius:8px;font-size:13px;border:1px solid var(--boa-gray-border);background:#fff;cursor:pointer;}
  .btn-outline:hover{background:var(--boa-gray-bg);}
  .btn-danger{padding:8px 16px;border-radius:8px;font-size:13px;border:none;background:var(--boa-red);color:#fff;cursor:pointer;}
  .btn-danger:hover{background:#a8311f;}

  /* ─── Project detail ─────────────────────────────────────── */
  .back-link{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#6b7280;
    text-decoration:none;margin-bottom:14px;cursor:pointer;background:none;border:none;
  }
  .back-link:hover{color:var(--boa-green);}

  .detail-header{background:#fff;border:1px solid var(--boa-gray-border);border-radius:12px;padding:20px;}
  .detail-header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
  .detail-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .detail-progress{min-width:160px;}
  .detail-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px;}
  .meta-item label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#9ca3af;margin-bottom:4px;}
  .meta-item .value{font-size:13.5px;font-weight:600;color:var(--boa-black);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--boa-gray-border);margin:20px 0;overflow-x:auto;}
  .tab-btn{
    padding:10px 16px;font-size:13px;font-weight:600;color:#9ca3af;background:none;
    border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
  }
  .tab-btn:hover{color:var(--boa-green-dark);}
  .tab-btn.active{color:var(--boa-green);border-bottom-color:var(--boa-green);}

  .info-section{margin-bottom:20px;}
  .info-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#9ca3af;margin-bottom:8px;font-weight:600;}
  .info-section p{font-size:13.5px;color:#374151;line-height:1.6;white-space:pre-line;}

  .team-list{display:flex;flex-direction:column;gap:8px;}
  .team-member{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--boa-gray-surf);border-radius:8px;}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--boa-navy-light);color:var(--boa-navy);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;
  }
  .team-member .name{font-size:13px;font-weight:600;color:var(--boa-black);}
  .team-member .role{font-size:11.5px;color:#9ca3af;}

  /* Milestones / tasks */
  .milestone-card{border:1px solid var(--boa-gray-border);border-radius:12px;margin-bottom:14px;overflow:hidden;background:#fff;}
  .milestone-head{
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;background:var(--boa-gray-bg);border-bottom:1px solid var(--boa-gray-border);
  }
  .milestone-title{font-size:14px;font-weight:700;color:var(--boa-black);}
  .milestone-sub{font-size:11.5px;color:#9ca3af;margin-top:2px;}
  .milestone-body{padding:14px 18px;}
  .milestone-body table{font-size:12.5px;}
  .milestone-body th, .milestone-body td{padding:8px 10px;}
  .milestone-progress{display:flex;align-items:center;gap:8px;min-width:120px;}
  .milestone-progress .progress-track{width:80px;}
  .deliverables{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .deliverable-tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--boa-gray-surf);color:#6b7280;}

  /* Jalons : sélecteur de vue */
  .view-switcher{display:flex;gap:6px;background:var(--boa-gray-bg);border:1px solid var(--boa-gray-border);border-radius:10px;padding:4px;}
  .view-switcher button{
    border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;
    color:#6b7280;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .view-switcher button.active{background:#fff;color:var(--boa-navy);box-shadow:0 1px 2px rgba(0,0,0,.06);}

  /* Jalons : vue Kanban */
  .kanban-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start;}
  .kanban-col{background:var(--boa-gray-bg);border:1px solid var(--boa-gray-border);border-radius:12px;padding:10px;min-height:80px;}
  .kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-size:12px;font-weight:700;color:#374151;}
  .kanban-card{background:#fff;border:1px solid var(--boa-gray-border);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:grab;}
  .kanban-card:active{cursor:grabbing;}
  .kanban-card.dragging{opacity:.4;}
  .kanban-col.drag-over{background:var(--boa-navy-light);}
  .kanban-card .kc-title{font-size:12.5px;font-weight:700;color:var(--boa-black);margin-bottom:4px;}
  .kanban-card .kc-sub{font-size:11px;color:#9ca3af;margin-bottom:8px;}
  .kanban-empty{font-size:12px;color:#9ca3af;text-align:center;padding:16px 4px;}

  /* Jalons : vue chronologique (Gantt) */
  .gantt-wrap{display:flex;border:1px solid var(--boa-gray-border);border-radius:12px;background:#fff;overflow:hidden;}
  .gantt-labels{flex:0 0 240px;border-right:1px solid var(--boa-gray-border);}
  .gantt-scroll{overflow-x:auto;flex:1;}
  .gantt-inner{position:relative;}
  .gantt-head-years{display:flex;height:24px;border-bottom:1px solid var(--boa-gray-border);}
  .gantt-head-months{display:flex;height:22px;border-bottom:1px solid var(--boa-gray-border);}
  .gantt-head-cell{flex-shrink:0;text-align:center;font-size:10px;color:#9ca3af;border-right:1px solid var(--boa-gray-border);display:flex;align-items:center;justify-content:center;}
  .gantt-head-cell.year{font-weight:700;color:#374151;font-size:11px;}
  .gantt-labels-head{height:46px;border-bottom:1px solid var(--boa-gray-border);display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.04em;}
  .gantt-row{height:34px;display:flex;align-items:center;padding:0 12px;font-size:12px;border-bottom:1px solid var(--boa-gray-border);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .gantt-row.gantt-milestone-row{font-weight:700;background:var(--boa-gray-bg);}
  .gantt-row.gantt-task-row{color:#6b7280;padding-left:24px;}
  .gantt-track{position:relative;height:34px;border-bottom:1px solid var(--boa-gray-border);}
  .gantt-bar{
    position:absolute;top:7px;height:20px;border-radius:6px;background:var(--boa-gray-surf);
    border:1px solid var(--boa-gray-border);overflow:visible;box-sizing:border-box;
  }
  .gantt-bar-fill{height:100%;border-radius:5px;}
  .gantt-handle{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3;}
  .gantt-handle-left{left:-4px;}
  .gantt-handle-right{right:-4px;}
  .gantt-handle:hover{background:rgba(0,0,0,.18);border-radius:4px;}
  .gantt-bar.dragging{box-shadow:0 0 0 2px var(--boa-navy);}
  .gantt-bar.critical{box-shadow:0 0 0 2px var(--boa-red);}
  .gantt-diamond{position:absolute;top:9px;width:16px;height:16px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);}
  .gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--boa-red);z-index:2;}
  .gantt-deps-svg{position:absolute;top:0;left:0;z-index:1;pointer-events:none;}
  .gantt-deps-svg path.gantt-dep-link{cursor:pointer;pointer-events:stroke;}
  .gantt-deps-svg path.gantt-dep-link:hover{stroke:var(--boa-red);stroke-width:2.5;}
  .gantt-connector{
    position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;margin-left:-5px;
    border-radius:50%;background:var(--boa-navy);border:2px solid #fff;box-shadow:0 0 0 1px var(--boa-navy);
    cursor:crosshair;z-index:4;
  }
  .gantt-connector:hover{transform:scale(1.3);}
  .gantt-legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:#6b7280;margin-top:10px;}
  .gantt-legend .lg-swatch{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:middle;}
  .gantt-legend .lg-diamond{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:7px;vertical-align:middle;}

  /* Jalons : vue dépendances (graphe) */
  .deps-graph{position:relative;overflow:auto;background:#fff;border:1px solid var(--boa-gray-border);border-radius:12px;padding:20px;}
  .deps-lines{position:absolute;top:0;left:0;pointer-events:none;}
  .deps-task-card{position:absolute;background:#fff;border:1px solid var(--boa-gray-border);border-radius:10px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .deps-task-card .dc-title{font-size:12px;font-weight:700;color:var(--boa-black);margin-bottom:3px;line-height:1.25;}
  .deps-task-card .dc-sub{font-size:10.5px;color:#9ca3af;}
  .deps-milestone-wrap{position:absolute;display:flex;flex-direction:column;align-items:center;}

function lineActual(project, lineId){

    .filter(e=>e.lineId===lineId)

/* ─── ID / code generators & shared computations ─────────────── */
function newId(){
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function generateProjectCode(projects){
  const year = new Date().getFullYear();
  const nums = projects.map(p=>{
    const m = p.code.match(/PRJ-\d{4}-(\d{3})/);
    return m ? parseInt(m[1]) : 0;
  });
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `PRJ-${year}-${String(next).padStart(3,'0')}`;
}
function computeProjectProgress(milestones){
  if(!milestones.length) return 0;
  const totalWeight = milestones.reduce((s,m)=>s+m.weight, 0);
  if(!totalWeight) return 0;
  const weighted = milestones.reduce((s,m)=> s + milestoneProgress(m) * m.weight, 0);
  return Math.round(weighted / totalWeight);
}
function computeRiskScore(probability, impact){
  const probScore = { FAIBLE:1, MOYEN:2, ELEVE:3 };
  const impactScore = { FAIBLE:1, MOYEN:2, ELEVE:3, CRITIQUE:4 };
  return probScore[probability] * impactScore[impact];
}

/* ─── Modal système générique ──────────────────────────────────
   openModal({title, fields, onSubmit, wide}) où chaque field est :
   {name, label, type:'text'|'textarea'|'date'|'number'|'email'|'select'|'tags',
    value, options:[{value,label}], required, full, rows}
   ────────────────────────────────────────────────────────────── */
let activeModal = null;

function openModal(config){
  activeModal = config;
  renderModal();
}
function closeModal(){
  activeModal = null;
  document.getElementById('modal-root').innerHTML = '';
}
function renderModal(){
  if(!activeModal){ document.getElementById('modal-root').innerHTML = ''; return; }
  const { title, fields, wide } = activeModal;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-card${wide ? ' modal-wide' : ''}">
        <h3>${escapeHtml(title)}</h3>
        <div class="form-grid">
          ${fields.map(renderModalField).join('')}
        </div>
        <div class="modal-actions" style="margin-top:18px;">
          <button class="btn-outline" onclick="closeModal()">Annuler</button>
          <button class="btn-primary" onclick="submitModal()">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
}
function renderModalField(f){
  const id = `field-${f.name}`;
  const value = f.value ?? '';
  let input;
  if(f.type === 'textarea'){
    input = `<textarea id="${id}" rows="${f.rows || 3}">${escapeHtml(value)}</textarea>`;
  } else if(f.type === 'select'){
    input = `<select id="${id}">${f.options.map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
  } else if(f.type === 'tags'){
    input = `<input id="${id}" type="text" value="${escapeHtml(Array.isArray(value)?value.join(', '):value)}" placeholder="séparés par des virgules">`;
  } else {
    input = `<input id="${id}" type="${f.type || 'text'}" value="${escapeHtml(value)}">`;
  }
  return `<div class="form-field${f.full?' full':''}"><label>${escapeHtml(f.label)}${f.required?' *':''}</label>${input}</div>`;
}
function submitModal(){
  const values = {};
  for(const f of activeModal.fields){
    const el = document.getElementById(`field-${f.name}`);
    let v = el.value;
    if(f.type === 'number') v = v === '' ? undefined : parseFloat(v);
    if(f.type === 'tags') v = v.split(',').map(s=>s.trim()).filter(Boolean);
    if(f.required && (v === '' || v === undefined || (Array.isArray(v) && v.length===0))){
      el.style.outline = '2px solid var(--boa-red)';
      el.focus();
      return;
    }
    values[f.name] = v;
  }
  const onSubmit = activeModal.onSubmit;
  closeModal();
  onSubmit(values);
}

/* ─── Date helpers ──────────────────────────────────────────── */
function fmt(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function daysLeft(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function isOverdue(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  return d < now;
}

/* ─── Stats ─────────────────────────────────────────────────── */
function getProjectStats(projects){
  return {
    total: projects.length,
    enCours: projects.filter(p=>p.status==='EN_COURS').length,
    termine: projects.filter(p=>p.status==='TERMINE').length,
    enRetard: projects.filter(p=>p.status==='EN_COURS' && isOverdue(p.plannedEndDate)).length,
    rouge: projects.filter(p=>p.healthStatus==='ROUGE').length,
    orange: projects.filter(p=>p.healthStatus==='ORANGE').length,
    vert: projects.filter(p=>p.healthStatus==='VERT').length,
  };
}
function getAllOpenActions(projects){
  return projects.flatMap(p=>
    p.journal.flatMap(j=>
      j.actionItems.filter(a=>a.status!=='FERME')
        .map(a=>({...a, projectId:p.id, projectName:p.name, projectCode:p.code, journalId:j.id, journalTitle:j.title}))
    )
  );
}

/* ─── Storage ───────────────────────────────────────────────── */
function loadProjects(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    let projects;
    if(!raw){ projects = getSampleData(); saveProjects(projects); return projects; }
    projects = JSON.parse(raw);
    if(migrateBudgets(projects)) saveProjects(projects);
    return projects;
  }catch(e){ return getSampleData(); }
}

/* ─── Stockage : Suivi du Run ────────────────────────────────── */
function loadRunItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_RUN);
    if(!raw){ const items = getSampleRunItems(); saveRunItems(items); return items; }
    return JSON.parse(raw);
  }catch(e){ return []; }
}
function saveRunItems(items){
  localStorage.setItem(STORAGE_KEY_RUN, JSON.stringify(items));
}
function getSampleRunItems(){
  const now = new Date().toISOString();

/* Ajoute le journal des dépenses (expenses) aux anciens projets qui n'en ont pas encore */
function migrateBudgets(projects){
  let changed = false;
  projects.forEach(p=>{
    if(!p.budget) p.budget = { currency:'MAD', totalEstimated:0, totalActual:0, lines:[] };
    if(!p.budget.expenses){
      p.budget.expenses = [];
      (p.budget.lines||[]).forEach(l=>{
        if(l.actual){
          p.budget.expenses.push({ id:newId(), date:p.startDate, lineId:l.id, description:'Solde initial', amount:l.actual });
        }
      });
      changed = true;
    }
    if(p.budget.established === undefined){
      p.budget.established = p.budget.lines.length > 0;
      if(p.budget.established) p.budget.establishedDate = p.startDate;
      changed = true;
    }
  });
  return changed;
}
function saveProjects(projects){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}

function navigate(view){
  if(!VIEWS[view]) view = 'dashboard';
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.getElementById('page-title').textContent = VIEWS[view].title;
  document.getElementById('page-subtitle').textContent = VIEWS[view].subtitle;
  VIEWS[view].render();
  location.hash = view;
}

});

/* ─── Export / Import / Impression ─────────────────────────── */
document.getElementById('export-btn').addEventListener('click', ()=>{
  const data = JSON.stringify({ projects: loadProjects(), runItems: loadRunItems() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `boa-monitoring-export-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', ()=>{
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const projects = Array.isArray(data) ? data : data.projects;
      const runItems = Array.isArray(data) ? null : data.runItems;
      if(!Array.isArray(projects)) throw new Error('Format invalide');
      if(!confirm(`Importer ${projects.length} projet(s) ? Cela remplacera toutes les données actuelles.`)) return;
      saveProjects(projects);
      if(Array.isArray(runItems)) saveRunItems(runItems);
      const view = location.hash.replace('#','') || 'dashboard';
      if(view.startsWith('project/')) viewProject(view.split('/')[1]);
      else navigate(view.startsWith('project-form') ? 'projects' : view);
    }catch(err){
      alert("Le fichier sélectionné n'est pas un export valide : " + err.message);
    }finally{
      e.target.value = '';
    }
  };
  reader.readAsText(file);
});

const runFilterState = { search:'', status:'', type:'', responsible:'' };

}

  runFilterState.search = '';
  runFilterState.status = '';
  runFilterState.type = '';
  runFilterState.responsible = '';
  renderRun();
}

  const overdue = item.status !== 'FERME' && item.dueDate && isOverdue(item.dueDate);
  const project = item.projectId ? projects.find(p=>p.id===item.projectId) : null;
  return `
    <div class="journal-card" style="${overdue ? 'border-color:#f5c4bf;background:var(--boa-red-light);' : ''}">
      <div class="journal-card-head">
        <div>
          <div class="journal-card-title">${escapeHtml(item.title)}</div>
          <div class="journal-card-meta">
            ${fmt(item.date)} · Responsable : ${escapeHtml(item.responsible)}${item.dueDate ? ' · Échéance : ' + fmt(item.dueDate) : ''}
            ${project ? ` · Projet : ${escapeHtml(project.code)} — ${escapeHtml(project.name)}` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
          <span class="badge" style="${RUN_TYPE_COLORS[item.type]}">${RUN_TYPE_LABELS[item.type]}</span>
          <span class="badge" style="${RUN_STATUS_COLORS[item.status]}">${RUN_STATUS_LABELS[item.status]}</span>
          ${overdue ? `<span class="badge" style="background:var(--boa-red-light);color:var(--boa-red);">En retard</span>` : ''}
        </div>
      </div>
      <div class="journal-card-desc">${escapeHtml(item.description)}</div>
      ${item.updates && item.updates.length ? `
        <div class="journal-actions-list">
          ${item.updates.map(u=>`
            <div class="action-item-row" style="align-items:flex-start;">
              <span class="due" style="flex-shrink:0;">${fmt(u.date)}</span>
              <span class="flex1">${escapeHtml(u.note)}${u.author ? ' — ' + escapeHtml(u.author) : ''}</span>
            </div>`).join('')}
        </div>` : ''
      }
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap;">
        ${project ? `<button class="btn-secondary" onclick="navigate('projects'); viewProject('${project.id}')">${icon('Eye')} Voir le projet</button>` : ''}

function renderRun(){
  const projects = loadProjects();
  const items = loadRunItems();
  const { search, status, type, responsible } = runFilterState;
  const q = search.toLowerCase();

  const filtered = items.filter(it=>{
    const matchSearch = !q || it.title.toLowerCase().includes(q) || it.description.toLowerCase().includes(q);
    const matchStatus = !status || it.status === status;
    const matchType = !type || it.type === type;
    const matchResp = !responsible || it.responsible === responsible;
    return matchSearch && matchStatus && matchType && matchResp;
  });

  const open = filtered.filter(it=>it.status !== 'FERME');
  const overdue = open.filter(it=>it.dueDate && isOverdue(it.dueDate)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const ongoing = open.filter(it=>!(it.dueDate && isOverdue(it.dueDate))).sort((a,b)=>b.date.localeCompare(a.date));
  const closed = filtered.filter(it=>it.status === 'FERME').sort((a,b)=>b.date.localeCompare(a.date));

  const responsibles = [...new Set(items.map(it=>it.responsible))].sort();
  const hasFilters = search || status || type || responsible;

  document.getElementById('content').innerHTML = `
    <div class="filters-bar">
      <div class="search-wrap">
        ${icon('Search','#9ca3af')}
        <input id="run-search" type="text" placeholder="Rechercher un sujet..." value="${escapeHtml(search)}">
      </div>
      <div class="select-wrap">
        <select onchange="updateRunFilter('status', this.value)">
          <option value="">Statut</option>
          ${Object.entries(RUN_STATUS_LABELS).map(([k,v])=>`<option value="${k}" ${status===k?'selected':''}>${v}</option>`).join('')}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      <div class="select-wrap">
        <select onchange="updateRunFilter('type', this.value)">
          <option value="">Type</option>
          ${Object.entries(RUN_TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${type===k?'selected':''}>${v}</option>`).join('')}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      <div class="select-wrap">
        <select onchange="updateRunFilter('responsible', this.value)">
          <option value="">Responsable</option>
          ${responsibles.map(r=>`<option value="${escapeHtml(r)}" ${responsible===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      ${hasFilters ? `<button class="clear-link" onclick="clearRunFilters()">Effacer</button>` : ''}
      <button class="btn-primary" style="margin-left:auto;" onclick="openRunItemModal()">${icon('Plus')} Nouveau point</button>
    </div>

    <div class="section-card" style="margin-bottom:20px;">
      <div class="section-head">
        <h2>${icon('AlertTriangle','#c0392b')} En retard <span class="count">${overdue.length}</span></h2>
      </div>
      <div style="padding:16px;">
        ${overdue.length ? overdue.map(it=>runItemCard(it, projects)).join('') : `<div class="empty">Aucun point en retard.</div>`}
      </div>
    </div>
    <div class="section-card" style="margin-bottom:20px;">
      <div class="section-head">
        <h2>${icon('Clock','#1B2E5E')} En cours / à traiter <span class="count">${ongoing.length}</span></h2>
      </div>
      <div style="padding:16px;">
        ${ongoing.length ? ongoing.map(it=>runItemCard(it, projects)).join('') : `<div class="empty">Aucun point en cours.</div>`}
      </div>
    </div>
    <div class="section-card">
      <div class="section-head">
        <h2>${icon('CheckCircle2','#1B7A4B')} Clôturés <span class="count">${closed.length}</span></h2>
      </div>
      <div style="padding:16px;">
        ${closed.length ? closed.slice(0,10).map(it=>runItemCard(it, projects)).join('') : `<div class="empty">Aucun point clôturé.</div>`}
      </div>
    </div>`;

  document.getElementById('run-search').addEventListener('input', e=>{
    runFilterState.search = e.target.value;
    renderRun();
  });
}

        options:[{value:'', label:'Aucun'}, ...projects.map(p=>({value:p.id, label:`${p.code} — ${p.name}`}))],
        value:item?.projectId || ''},
    ],
    onSubmit:(v)=>{
      const all = loadRunItems();
      if(item){
        const idx = all.findIndex(it=>it.id===item.id);
        all[idx] = { ...item, ...v, updatedAt:new Date().toISOString() };
      } else {
        const now = new Date().toISOString();
        all.unshift({ id:newId(), ...v, updates:[], createdAt:now, updatedAt:now });
      }
      saveRunItems(all);
      renderRun();
    }
  });
}

function openRunUpdateModal(itemId){
  openModal({
    title:'Ajouter un suivi', wide:true,
    fields:[
      {name:'date', label:'Date', type:'date', required:true, value:todayStr()},
      {name:'note', label:'Suivi / commentaire', type:'textarea', required:true, full:true},
    ],
    onSubmit:(v)=>{
      const all = loadRunItems();
      const item = all.find(it=>it.id===itemId);
      item.updates.push({ id:newId(), date:v.date, note:v.note, author:'Nadrey BOA' });
      item.updatedAt = new Date().toISOString();
      saveRunItems(all);
      renderRun();
    }
  });
}

function closeRunItem(id){
  const all = loadRunItems();
  const item = all.find(it=>it.id===id);
  item.status = 'FERME';
  item.closedDate = todayStr();
  item.updatedAt = new Date().toISOString();
  saveRunItems(all);
  renderRun();
}
function reopenRunItem(id){
  const all = loadRunItems();
  const item = all.find(it=>it.id===id);
  item.status = 'EN_COURS';
  item.closedDate = undefined;
  item.updatedAt = new Date().toISOString();
  saveRunItems(all);
  renderRun();
}
function deleteRunItem(id){
  if(!confirm('Supprimer définitivement ce point de suivi ?')) return;
  saveRunItems(loadRunItems().filter(it=>it.id!==id));
  renderRun();
}

    .flatMap(p=>p.journal.map(j=>({...j, projectId:p.id, projectName:p.name, projectCode:p.code})))

const projectsFilterState = { search:'', status:'', priority:'', category:'' };
let confirmDeleteId = null;

function updateProjectsFilter(key, value){
  projectsFilterState[key] = value;
  renderProjects();
}
function clearProjectsFilters(){
  projectsFilterState.search = '';
  projectsFilterState.status = '';
  projectsFilterState.priority = '';
  projectsFilterState.category = '';
  renderProjects();
}
function requestDeleteProject(id){
  confirmDeleteId = id;
  renderProjects();
}
function cancelDeleteProject(){
  confirmDeleteId = null;
  renderProjects();
}
function performDeleteProject(){
  const projects = loadProjects().filter(p=>p.id !== confirmDeleteId);
  saveProjects(projects);
  confirmDeleteId = null;
  renderProjects();
}
function viewProject(id){ alert('La fiche projet sera disponible à l\'étape 3.'); }
function editProject(id){ alert('Le formulaire de modification sera disponible à l\'étape 5.'); }

function csvEscape(value){
  const s = String(value ?? '');
  if(/[";\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportProjectsCSV(){
  const projects = loadProjects();
  const headers = ['Code','Nom','Catégorie','Statut','Priorité','Santé','Avancement (%)','Chef de projet','Date début','Date fin prévue'];
  const rows = projects.map(p=>[
    p.code, p.name, CATEGORY_LABELS[p.category] ?? p.category, STATUS_LABELS[p.status],
    PRIORITY_LABELS[p.priority], HEALTH_LABELS[p.healthStatus], p.progress,
    p.projectManager, fmt(p.startDate), fmt(p.plannedEndDate)
  ]);
  const csv = [headers, ...rows].map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `boa-monitoring-projets-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderProjects(){
  const projects = loadProjects();
  const { search, status, priority, category } = projectsFilterState;
  const q = search.toLowerCase();

  const filtered = projects.filter(p=>{
    const matchSearch = !q
      || p.name.toLowerCase().includes(q)
      || p.code.toLowerCase().includes(q)
      || p.projectManager.toLowerCase().includes(q);
    const matchStatus = !status || p.status === status;
    const matchPriority = !priority || p.priority === priority;
    const matchCat = !category || p.category === category;
    return matchSearch && matchStatus && matchPriority && matchCat;
  });

  document.getElementById('page-subtitle').textContent = `${filtered.length} projet(s)`;

  const hasFilters = search || status || priority || category;

  const statusOptions = Object.keys(STATUS_LABELS)
    .map(s=>`<option value="${s}" ${status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('');
  const priorityOptions = Object.keys(PRIORITY_LABELS)
    .map(p=>`<option value="${p}" ${priority===p?'selected':''}>${PRIORITY_LABELS[p]}</option>`).join('');
  const categoryOptions = Object.entries(CATEGORY_LABELS)
    .map(([k,v])=>`<option value="${k}" ${category===k?'selected':''}>${v}</option>`).join('');

  let html = `
    <div class="filters-bar">
      <div class="search-wrap">
        ${icon('Search','#9ca3af')}
        <input id="project-search" type="text" placeholder="Rechercher un projet..." value="${escapeHtml(search)}">
      </div>
      <div class="select-wrap">
        <select onchange="updateProjectsFilter('status', this.value)">
          <option value="">Statut</option>
          ${statusOptions}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      <div class="select-wrap">
        <select onchange="updateProjectsFilter('priority', this.value)">
          <option value="">Priorité</option>
          ${priorityOptions}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      <div class="select-wrap">
        <select onchange="updateProjectsFilter('category', this.value)">
          <option value="">Catégorie</option>
          ${categoryOptions}
        </select>
        ${icon('ChevronDown','#9ca3af')}
      </div>
      ${hasFilters ? `<button class="clear-link" onclick="clearProjectsFilters()">Effacer</button>` : ''}
      <button class="btn-secondary" style="margin-left:auto;" onclick="exportProjectsCSV()">${icon('FileDown')} Export CSV</button>
    </div>
  `;

  if(filtered.length === 0){
    html += `
      <div class="empty" style="padding:60px 18px;">
        Aucun projet trouvé.
      </div>`;
  } else {
    html += `
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Projet</th>
              <th>Statut</th>
              <th>Priorité</th>
              <th>Santé</th>
              <th>Avancement</th>
              <th>Chef de projet</th>
              <th>Fin prévue</th>
              <th class="right">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(p=>{
              const overdue = p.status === 'EN_COURS' && isOverdue(p.plannedEndDate);
              const days = daysLeft(p.plannedEndDate);
              return `
              <tr>
                <td>
                  <div class="pname">${escapeHtml(p.name)}</div>
                  <div class="psub">${p.code} · ${CATEGORY_LABELS[p.category] ?? p.category}</div>
                </td>
                <td><span class="badge" style="${STATUS_COLORS[p.status]}">${STATUS_LABELS[p.status]}</span></td>
                <td><span class="badge" style="${PRIORITY_COLORS[p.priority]}">${PRIORITY_LABELS[p.priority]}</span></td>
                <td>
                  <span class="health-cell">
                    <span class="dot" style="background:${ {VERT:'#1B7A4B',ORANGE:'#d4830a',ROUGE:'#c0392b'}[p.healthStatus] }"></span>
                    ${HEALTH_LABELS[p.healthStatus]}
                  </span>
                </td>
                <td style="width:140px;">
                  <div class="progress-track"><div class="progress-fill" style="width:${p.progress}%"></div></div>
                  <div class="progress-label">${p.progress}%</div>
                </td>
                <td>${escapeHtml(p.projectManager)}</td>
                <td>
                  <div style="${overdue ? 'color:var(--boa-red);font-weight:600;' : 'color:#374151;'}">${fmt(p.plannedEndDate)}</div>
                  ${p.status==='EN_COURS' ? `<div style="font-size:11px;margin-top:2px;${overdue ? 'color:var(--boa-red);' : days<=30 ? 'color:var(--boa-orange);' : 'color:#9ca3af;'}">${overdue ? `${Math.abs(days)}j de retard` : `${days}j restants`}</div>` : ''}

                  <button class="icon-btn" title="Modifier" onclick="editProject('${p.id}')">${icon('Pencil')}</button>

                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  if(confirmDeleteId){
    html += `
      <div class="modal-overlay" onclick="if(event.target===this) cancelDeleteProject()">
        <div class="modal-card">
          <h3>Supprimer ce projet ?</h3>
          <p>Cette action est irréversible. Toutes les données associées seront perdues.</p>
          <div class="modal-actions">
            <button class="btn-outline" onclick="cancelDeleteProject()">Annuler</button>
            <button class="btn-danger" onclick="performDeleteProject()">Supprimer</button>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('content').innerHTML = html;

  const searchInput = document.getElementById('project-search');
  if(searchInput){
    searchInput.addEventListener('input', e=>{
      const cursor = e.target.selectionStart;
      updateProjectsFilter('search', e.target.value);
      const newInput = document.getElementById('project-search');
      newInput.focus();
      newInput.setSelectionRange(cursor, cursor);
    });
  }
}

function dragMilestone(ev, milestoneId){
  ev.dataTransfer.setData('text/plain', milestoneId);
  ev.target.classList.add('dragging');
}

function dropMilestone(ev, projectId, newStatus){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const milestoneId = ev.dataTransfer.getData('text/plain');
  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  const m = p.milestones.find(x=>x.id===milestoneId);
  if(!m || m.status === newStatus) return;
  m.status = newStatus;
  if(newStatus === 'TERMINE' && !m.actualDate) m.actualDate = todayStr();
  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

const GANTT_MONTH_WIDTH = 46;
const MONTH_LABELS_FR = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];

function ganttTaskDates(t){
  const end = new Date(t.plannedDate);
  const start = new Date(end);
  start.setDate(start.getDate() - Math.max(1, t.estimatedDays || 1));
  return { start, end };
}

function ganttDateRange(project){
  let min = null, max = null;
  const consider = (dt)=>{
    if(!dt || isNaN(dt)) return;
    if(!min || dt < min) min = dt;
    if(!max || dt > max) max = dt;
  };
  project.milestones.forEach(m=>{
    if(m.plannedDate) consider(new Date(m.plannedDate));
    if(m.actualDate) consider(new Date(m.actualDate));
    m.tasks.forEach(t=>{
      if(t.plannedDate){
        const { start, end } = ganttTaskDates(t);
        consider(start); consider(end);
      }
      if(t.actualDate) consider(new Date(t.actualDate));
    });
  });
  consider(new Date());
  if(!min || !max){ min = new Date(); max = new Date(); }
  min = new Date(min.getFullYear(), min.getMonth() - 1, 1);
  max = new Date(max.getFullYear(), max.getMonth() + 2, 1);
  return { min, max };
}

function ganttMonths(min, max){
  const months = [];
  let d = new Date(min.getFullYear(), min.getMonth(), 1);
  const end = new Date(max.getFullYear(), max.getMonth(), 1);
  while(d <= end){
    months.push(new Date(d));
    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  }
  return months;
}

function ganttDateToX(date, min, monthWidth){
  const months = (date.getFullYear() - min.getFullYear()) * 12 + (date.getMonth() - min.getMonth());
  const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  const frac = (date.getDate() - 1) / daysInMonth;
  return (months + frac) * monthWidth;
}

// Chemin coudé reliant la fin d'une tâche prédécesseur (x1,y1) au début de la tâche successeur (x2,y2)
function ganttDepPath(x1, y1, x2, y2){
  if(x2 - x1 >= 16){
    const midX = (x1 + x2) / 2;
    return `M${x1},${y1} H${midX} V${y2} H${x2}`;
  }
  const midY = y1 <= y2 ? y1 + 17 : y1 - 17;
  return `M${x1},${y1} h12 V${midY} H${x2-12} V${y2} H${x2}`;
}

// Calcule le chemin critique (méthode CPM) sur la base des durées et dépendances Fin->Début
function computeCriticalPath(project){
  const tasks = allProjectTasks(project).filter(t=>t.plannedDate);
  const byId = {};
  tasks.forEach(t=>byId[t.id] = t);
  const dur = {};
  tasks.forEach(t=>dur[t.id] = Math.max(1, t.estimatedDays || 1));

  const ES = {}, EF = {};
  function computeEF(id, seen){
    if(EF[id] !== undefined) return EF[id];
    if(seen.has(id)){ ES[id] = 0; return ES[id] + dur[id]; }
    seen.add(id);
    const deps = (byId[id].dependencies || []).filter(d=>byId[d]);
    const es = deps.length ? Math.max(...deps.map(d=>computeEF(d, seen))) : 0;
    ES[id] = es;
    EF[id] = es + dur[id];
    return EF[id];
  }
  tasks.forEach(t=>computeEF(t.id, new Set()));

  const projectEnd = Math.max(0, ...tasks.map(t=>EF[t.id]));

  const successors = {};
  tasks.forEach(t=>successors[t.id] = []);
  tasks.forEach(t=>(t.dependencies || []).forEach(d=>{ if(successors[d]) successors[d].push(t.id); }));

  const LS = {};
  function computeLS(id, seen){
    if(LS[id] !== undefined) return LS[id];
    if(seen.has(id)){ LS[id] = projectEnd - dur[id]; return LS[id]; }
    seen.add(id);
    const succs = successors[id];
    const lf = succs.length ? Math.min(...succs.map(s=>computeLS(s, seen))) : projectEnd;
    LS[id] = lf - dur[id];
    return LS[id];
  }
  tasks.forEach(t=>computeLS(t.id, new Set()));

  const criticalTasks = new Set();
  tasks.forEach(t=>{ if(LS[t.id] - ES[t.id] === 0) criticalTasks.add(t.id); });

  const criticalEdges = new Set();
  tasks.forEach(t=>{
    (t.dependencies || []).forEach(predId=>{
      if(!byId[predId]) return;
      if(criticalTasks.has(t.id) && criticalTasks.has(predId) && EF[predId] === ES[t.id]){
        criticalEdges.add(predId + '|' + t.id);
      }
    });
  });

  return { criticalTasks, criticalEdges };
}

function renderJalonsChrono(project){
  const { min, max } = ganttDateRange(project);
  const months = ganttMonths(min, max);
  const mw = GANTT_MONTH_WIDTH;
  const totalWidth = months.length * mw;
  const sorted = [...project.milestones].sort((a,b)=>a.order-b.order);

  const yearGroups = [];
  months.forEach(m=>{
    const y = m.getFullYear();
    if(yearGroups.length && yearGroups[yearGroups.length-1].year === y) yearGroups[yearGroups.length-1].count++;
    else yearGroups.push({ year:y, count:1 });
  });

  const { criticalTasks, criticalEdges } = computeCriticalPath(project);

  const todayX = ganttDateToX(new Date(), min, mw);
  let labelsHtml = `<div class="gantt-labels-head">Jalons &amp; tâches</div>`;
  let rowsHtml = '';
  let rowCount = 0;
  const taskPos = {};
  const allTasks = [];

  sorted.forEach(m=>{
    rowCount++;
    labelsHtml += `<div class="gantt-row gantt-milestone-row" title="${escapeHtml(m.name)}">${m.order}. ${escapeHtml(m.name)}</div>`;
    const msX = m.plannedDate ? ganttDateToX(new Date(m.plannedDate), min, mw) : null;
    rowsHtml += `<div class="gantt-track">
      ${msX !== null ? `<div class="gantt-diamond" style="left:${msX-8}px;background:${MILESTONE_STATUS_DOT[m.status]};" title="${escapeHtml(m.name)} — échéance : ${fmt(m.plannedDate)}"></div>` : ''}
    </div>`;

    [...m.tasks].sort((a,b)=>(a.plannedDate||'').localeCompare(b.plannedDate||'')).forEach(t=>{
      rowCount++;
      allTasks.push(t);
      labelsHtml += `<div class="gantt-row gantt-task-row" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>`;
      let barHtml = '';
      const rowY = (rowCount - 1) * 34 + 17;
      if(t.plannedDate){
        const { start, end } = ganttTaskDates(t);
        const x1 = ganttDateToX(start, min, mw);
        const x2 = ganttDateToX(end, min, mw);
        const w = Math.max(8, x2 - x1);
        taskPos[t.id] = { x1, x2: x1 + w, y: rowY };
        const isCritical = criticalTasks.has(t.id);
        barHtml = `
          <div class="gantt-bar${isCritical ? ' critical' : ''}" style="left:${x1}px;width:${w}px;" title="${escapeHtml(t.name)} : du ${fmt(start.toISOString().slice(0,10))} au ${fmt(t.plannedDate)} — ${t.progress}%${isCritical ? ' — Chemin critique' : ''}">
            <div class="gantt-bar-fill" style="width:${t.progress}%;background:${TASK_STATUS_BAR[t.status]};"></div>
            <div class="gantt-handle gantt-handle-left" data-project="${project.id}" data-task="${t.id}" data-edge="start"></div>
            <div class="gantt-handle gantt-handle-right" data-project="${project.id}" data-task="${t.id}" data-edge="end"></div>
          </div>
          <div class="gantt-connector" style="left:${x1+w+9}px;" data-project="${project.id}" data-task="${t.id}" title="Glisser pour créer une dépendance"></div>`;
      }
      rowsHtml += `<div class="gantt-track" data-task-id="${t.id}">${barHtml}</div>`;
    });
  });

  const totalHeight = rowCount * 34;

  // Liens de dépendance (FS : fin du prédécesseur -> début du successeur)
  const depPaths = [];
  allTasks.forEach(t=>{
    (t.dependencies || []).forEach(predId=>{
      const from = taskPos[predId];
      const to = taskPos[t.id];
      if(!from || !to) return;
      const isCritical = criticalEdges.has(predId + '|' + t.id);
      const stroke = isCritical ? 'var(--boa-red)' : '#9ca3af';
      const marker = isCritical ? 'ganttArrowCritical' : 'ganttArrow';
      depPaths.push(`<path class="gantt-dep-link" data-pred="${predId}" data-succ="${t.id}" data-project="${project.id}"
        d="${ganttDepPath(from.x2, from.y, to.x1, to.y)}" fill="none" stroke="${stroke}" stroke-width="${isCritical ? 2.5 : 1.5}" marker-end="url(#${marker})">
        <title>Dépendance Fin→Début (clic pour supprimer)</title>
      </path>`);
    });
  });
  const depsSvg = `
    <svg class="gantt-deps-svg" width="${totalWidth}" height="${totalHeight}">
      <defs>
        <marker id="ganttArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
        </marker>
        <marker id="ganttArrowCritical" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--boa-red)"/>
        </marker>
      </defs>
      ${depPaths.join('')}
    </svg>`;

  return `
    <div class="gantt-wrap">
      <div class="gantt-labels">
        ${labelsHtml}
      </div>
      <div class="gantt-scroll">
        <div class="gantt-inner" style="width:${totalWidth}px;">
          <div class="gantt-head-years">
            ${yearGroups.map(g=>`<div class="gantt-head-cell year" style="width:${g.count*mw}px;">${g.year}</div>`).join('')}
          </div>
          <div class="gantt-head-months">
            ${months.map(m=>`<div class="gantt-head-cell" style="width:${mw}px;">${MONTH_LABELS_FR[m.getMonth()]}</div>`).join('')}
          </div>
          <div style="position:relative;">
            ${todayX >= 0 && todayX <= totalWidth ? `<div class="gantt-today" style="left:${todayX}px;height:${totalHeight}px;" title="Aujourd'hui : ${fmt(todayStr())}"></div>` : ''}
            ${depsSvg}
            ${rowsHtml}
          </div>
        </div>
      </div>
    </div>
    <div class="gantt-legend">
      <span><span class="lg-diamond" style="background:${MILESTONE_STATUS_DOT.EN_COURS}"></span>Jalon (échéance)</span>
      <span><span class="lg-swatch" style="background:${TASK_STATUS_BAR.A_FAIRE}"></span>Tâche à faire</span>
      <span><span class="lg-swatch" style="background:${TASK_STATUS_BAR.EN_COURS}"></span>Tâche en cours</span>
      <span><span class="lg-swatch" style="background:${TASK_STATUS_BAR.TERMINE}"></span>Tâche terminée</span>
      <span><span class="lg-swatch" style="background:${TASK_STATUS_BAR.BLOQUE}"></span>Tâche bloquée</span>
      <span style="display:inline-flex;align-items:center;gap:6px;"><span style="display:inline-block;width:14px;height:2px;background:var(--boa-red);"></span>Aujourd'hui</span>
      <span style="display:inline-flex;align-items:center;gap:6px;"><span style="display:inline-block;width:14px;height:2px;background:#9ca3af;"></span>Dépendance (glisser depuis le point bleu pour en créer une, clic sur le lien pour le supprimer)</span>
      <span style="display:inline-flex;align-items:center;gap:6px;"><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px var(--boa-red);"></span>Chemin critique</span>
    </div>`;
}

let ganttDrag = null;
let ganttLink = null;

function initGanttDrag(){
  document.querySelectorAll('.gantt-handle').forEach(handle=>{
    handle.addEventListener('mousedown', startGanttResize);
  });
  document.querySelectorAll('.gantt-connector').forEach(connector=>{
    connector.addEventListener('mousedown', startGanttLink);
  });
  document.querySelectorAll('.gantt-dep-link').forEach(link=>{
    link.addEventListener('click', deleteGanttDependency);
  });
}

function startGanttResize(ev){
  ev.preventDefault();
  ev.stopPropagation();
  const handle = ev.currentTarget;
  const track = handle.parentElement;
  track.classList.add('dragging');
  ganttDrag = {
    track, handle,
    edge: handle.dataset.edge,
    projectId: handle.dataset.project,
    taskId: handle.dataset.task,
    startX: ev.clientX,
    origLeft: parseFloat(track.style.left),
    origWidth: parseFloat(track.style.width),
    pxPerDay: GANTT_MONTH_WIDTH / 30,
  };
  document.addEventListener('mousemove', onGanttResizeMove);
  document.addEventListener('mouseup', onGanttResizeEnd);
}

function onGanttResizeMove(ev){
  if(!ganttDrag) return;
  const dx = ev.clientX - ganttDrag.startX;
  const minW = 8;
  if(ganttDrag.edge === 'end'){
    const newWidth = Math.max(minW, ganttDrag.origWidth + dx);
    ganttDrag.track.style.width = newWidth + 'px';
  } else {
    let newLeft = ganttDrag.origLeft + dx;
    let newWidth = ganttDrag.origWidth - dx;
    if(newWidth < minW){
      newWidth = minW;
      newLeft = ganttDrag.origLeft + (ganttDrag.origWidth - minW);
    }
    ganttDrag.track.style.left = newLeft + 'px';
    ganttDrag.track.style.width = newWidth + 'px';
  }
}

function onGanttResizeEnd(ev){
  if(!ganttDrag) return;
  document.removeEventListener('mousemove', onGanttResizeMove);
  document.removeEventListener('mouseup', onGanttResizeEnd);
  const { track, edge, projectId, taskId, startX, pxPerDay } = ganttDrag;
  track.classList.remove('dragging');
  const dx = ev.clientX - startX;
  const dayDelta = Math.round(dx / pxPerDay);
  ganttDrag = null;
  if(dayDelta === 0) return;

  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  let task = null;
  p.milestones.forEach(m=>m.tasks.forEach(t=>{ if(t.id === taskId) task = t; }));
  if(!task || !task.plannedDate) return;

  const end = new Date(task.plannedDate);
  const start = new Date(end);
  start.setDate(start.getDate() - Math.max(1, task.estimatedDays || 1));

  if(edge === 'end'){
    end.setDate(end.getDate() + dayDelta);
    if(end <= start) end.setTime(start.getTime() + 86400000);
    task.plannedDate = end.toISOString().slice(0, 10);
  } else {
    start.setDate(start.getDate() + dayDelta);
    if(start >= end) start.setTime(end.getTime() - 86400000);
  }
  task.estimatedDays = Math.max(1, Math.round((end - start) / 86400000));

  cascadeGanttDependencies(p, task);

  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

// Décale les tâches successeurs (lien Fin->Début) si elles démarreraient avant la fin de leur prédécesseur
function cascadeGanttDependencies(project, changedTask){
  const tasksById = {};
  project.milestones.forEach(m=>m.tasks.forEach(t=>{ tasksById[t.id] = t; }));

  const queue = [changedTask.id];
  const visited = new Set();
  while(queue.length){
    const curId = queue.shift();
    const cur = tasksById[curId];
    if(!cur || !cur.plannedDate) continue;
    const curEnd = new Date(cur.plannedDate);

    Object.values(tasksById).forEach(t=>{
      if(!(t.dependencies || []).includes(curId)) return;
      if(!t.plannedDate) return;
      const tEnd = new Date(t.plannedDate);
      const tStart = new Date(tEnd);
      tStart.setDate(tStart.getDate() - Math.max(1, t.estimatedDays || 1));
      if(tStart < curEnd){
        const shiftDays = Math.round((curEnd - tStart) / 86400000);
        tEnd.setDate(tEnd.getDate() + shiftDays);
        t.plannedDate = tEnd.toISOString().slice(0, 10);
        if(!visited.has(t.id)){
          visited.add(t.id);
          queue.push(t.id);
        }
      }
    });
  }
}

// Vérifie si taskId dépend (directement ou transitivement) de targetId
function ganttDependsOn(tasksById, taskId, targetId, seen){
  seen = seen || new Set();
  if(seen.has(taskId)) return false;
  seen.add(taskId);
  const t = tasksById[taskId];
  if(!t) return false;
  for(const depId of (t.dependencies || [])){
    if(depId === targetId) return true;
    if(ganttDependsOn(tasksById, depId, targetId, seen)) return true;
  }
  return false;
}

function startGanttLink(ev){
  ev.preventDefault();
  ev.stopPropagation();
  const connector = ev.currentTarget;
  const track = connector.parentElement;
  const svg = track.closest('.gantt-inner').querySelector('.gantt-deps-svg');
  const wrapper = svg.parentElement;
  const x1 = parseFloat(connector.style.left);
  const y1 = track.offsetTop + 17;

  const temp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  temp.setAttribute('class', 'gantt-temp-link');
  temp.setAttribute('fill', 'none');
  temp.setAttribute('stroke', '#1B3A6B');
  temp.setAttribute('stroke-width', '2');
  temp.setAttribute('stroke-dasharray', '4 3');
  svg.appendChild(temp);

  ganttLink = {
    projectId: connector.dataset.project,
    predTaskId: connector.dataset.task,
    wrapper, svg, temp, x1, y1,
  };
  document.addEventListener('mousemove', onGanttLinkMove);
  document.addEventListener('mouseup', onGanttLinkEnd);
}

function onGanttLinkMove(ev){
  if(!ganttLink) return;
  const rect = ganttLink.wrapper.getBoundingClientRect();
  const x2 = ev.clientX - rect.left;
  const y2 = ev.clientY - rect.top;
  ganttLink.temp.setAttribute('d', `M${ganttLink.x1},${ganttLink.y1} L${x2},${y2}`);
}

function onGanttLinkEnd(ev){
  if(!ganttLink) return;
  document.removeEventListener('mousemove', onGanttLinkMove);
  document.removeEventListener('mouseup', onGanttLinkEnd);
  const { projectId, predTaskId, temp } = ganttLink;
  temp.remove();
  ganttLink = null;

  const target = document.elementFromPoint(ev.clientX, ev.clientY);
  const track = target ? target.closest('.gantt-track[data-task-id]') : null;
  if(!track) return;
  const succTaskId = track.dataset.taskId;
  if(succTaskId === predTaskId) return;

  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  const tasksById = {};
  p.milestones.forEach(m=>m.tasks.forEach(t=>{ tasksById[t.id] = t; }));
  const succ = tasksById[succTaskId];
  if(!succ) return;
  succ.dependencies = succ.dependencies || [];
  if(succ.dependencies.includes(predTaskId)) return;
  if(ganttDependsOn(tasksById, predTaskId, succTaskId)){
    alert('Impossible de créer cette dépendance : elle créerait une boucle entre les tâches.');
    return;
  }
  succ.dependencies.push(predTaskId);

  cascadeGanttDependencies(p, tasksById[predTaskId]);

  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

function deleteGanttDependency(ev){
  ev.preventDefault();
  ev.stopPropagation();
  const link = ev.currentTarget;
  const { project: projectId, pred: predTaskId, succ: succTaskId } = link.dataset;
  if(!confirm('Supprimer cette dépendance ?')) return;

  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  let succ = null;
  p.milestones.forEach(m=>m.tasks.forEach(t=>{ if(t.id === succTaskId) succ = t; }));
  if(!succ) return;
  succ.dependencies = (succ.dependencies || []).filter(d=>d !== predTaskId);

  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

function allProjectTasks(project){
  const tasks = [];
  project.milestones.forEach(m=>{
    m.tasks.forEach(t=>tasks.push({ ...t, milestoneName:m.name, milestoneOrder:m.order }));
  });
  return tasks;
}

function renderJalonsDeps(project){
  const tasks = allProjectTasks(project);
  const byId = {};
  tasks.forEach(t=>byId[t.id] = t);

  const level = {};
  function computeLevel(id, seen){
    if(level[id] !== undefined) return level[id];
    if(seen.has(id)) return 0;
    seen.add(id);
    const deps = (byId[id].dependencies || []).filter(d=>byId[d]);
    const lvl = deps.length === 0 ? 0 : 1 + Math.max(...deps.map(d=>computeLevel(d, seen)));
    level[id] = lvl;
    return lvl;
  }
  tasks.forEach(t=>computeLevel(t.id, new Set()));

  const sortedMilestones = [...project.milestones].sort((a,b)=>a.order-b.order);
  const msLevel = {};
  sortedMilestones.forEach(m=>{
    const taskLevels = m.tasks.map(t=>level[t.id]);
    msLevel[m.id] = taskLevels.length ? Math.max(...taskLevels) + 1 : 0;
  });

  const maxLevel = Math.max(0, ...tasks.map(t=>level[t.id]), ...Object.values(msLevel));
  const colWidth = 230, rowHeight = 86, cardW = 190, cardH = 60, diamond = 50;

  const columns = [];
  for(let i=0;i<=maxLevel;i++) columns.push([]);
  tasks.forEach(t=>columns[level[t.id]].push({ type:'task', data:t }));
  sortedMilestones.forEach(m=>columns[msLevel[m.id]].push({ type:'milestone', data:m }));

  const maxRows = Math.max(1, ...columns.map(c=>c.length));
  const totalWidth = (maxLevel + 1) * colWidth + 40;
  const totalHeight = maxRows * rowHeight + 40;

  const pos = {};
  columns.forEach((col, lvl)=>{
    col.forEach((node, row)=>{
      const x = lvl * colWidth + 20;
      const y = row * rowHeight + 20;
      if(node.type === 'task'){
        pos[node.data.id] = { x, y, w:cardW, h:cardH, cx:x+cardW/2, cy:y+cardH/2 };
      } else {
        pos['m_'+node.data.id] = { x:x+(cardW-diamond)/2, y, w:diamond, h:diamond, cx:x+cardW/2, cy:y+diamond/2 };
      }
    });
  });

  const edges = [];
  tasks.forEach(t=>{
    (t.dependencies || []).forEach(d=>{
      if(pos[d] && pos[t.id]) edges.push({ from:pos[d], to:pos[t.id] });
    });
  });
  sortedMilestones.forEach(m=>{
    m.tasks.forEach(t=>{
      if(pos[t.id] && pos['m_'+m.id]) edges.push({ from:pos[t.id], to:pos['m_'+m.id] });
    });
  });

  const edgePath = (e)=>{
    const x1 = e.from.x + e.from.w, y1 = e.from.cy;
    const x2 = e.to.x, y2 = e.to.cy;
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
  };

  let nodesHtml = '';
  columns.forEach((col)=>{
    col.forEach((node)=>{
      if(node.type === 'task'){
        const t = node.data, p = pos[t.id];
        nodesHtml += `
          <div class="deps-task-card" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;border-left:4px solid ${TASK_STATUS_BAR[t.status]};">
            <div class="dc-title">${escapeHtml(t.name)}</div>
            <div class="dc-sub">Jalon ${t.milestoneOrder} · ${TASK_STATUS_LABELS[t.status]} · ${fmt(t.plannedDate)}</div>
          </div>`;
      } else {
        const m = node.data, p = pos['m_'+m.id];
        nodesHtml += `
          <div class="deps-milestone-wrap" style="left:${p.x-(cardW-diamond)/2}px;top:${p.y}px;width:${cardW}px;">
            <div class="deps-milestone-diamond" style="background:${MILESTONE_STATUS_DOT[m.status]};"><span>J${m.order}</span></div>
            <div class="deps-milestone-label">${escapeHtml(m.name)}</div>
          </div>`;
      }
    });
  });

  const linesHtml = `
    <svg class="deps-lines" width="${totalWidth}" height="${totalHeight}">
      <defs>
        <marker id="depsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
        </marker>
      </defs>
      ${edges.map(e=>`<path d="${edgePath(e)}" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#depsArrow)"/>`).join('')}
    </svg>`;

  return `
    <div class="deps-graph" style="max-height:640px;">
      <div style="position:relative;width:${totalWidth}px;height:${totalHeight}px;">
        ${linesHtml}
        ${nodesHtml}
      </div>
    </div>
    <div class="gantt-legend">
      <span><span class="lg-swatch" style="background:#fff;border:1px solid var(--boa-gray-border);"></span>Tâche (couleur de bord = statut)</span>
      <span><span class="lg-diamond" style="background:${MILESTONE_STATUS_DOT.EN_COURS}"></span>Jalon (point de validation)</span>
      <span>→ Lien de dépendance / enchaînement</span>
    </div>`;
}

function validateInitialBudget(projectId){
  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  if(p.budget.lines.length === 0) return;
  if(!confirm("Valider le budget initial ? Toute modification ultérieure des lignes sera tracée dans le journal du projet.")) return;
  p.budget.established = true;
  p.budget.establishedDate = todayStr();
  addBudgetJournalEntry(p, 'Validation du budget initial',
    `Budget initial validé pour un montant total estimé de ${formatMoney(budgetTotalEstimated(p), p.budget.currency)} (${p.budget.lines.length} ligne(s)).`);
  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

function deleteBudgetLine(projectId, lineId){
  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  const line = p.budget.lines.find(l=>l.id===lineId);
  if(!confirm(`Supprimer la ligne "${line.category} — ${line.description}" ?`)) return;
  p.budget.lines = p.budget.lines.filter(l=>l.id!==lineId);
  if(p.budget.established){
    addBudgetJournalEntry(p, 'Suppression d\'une ligne budgétaire',
      `Ligne supprimée : ${line.category} — ${line.description} (estimé ${formatMoney(line.estimated, p.budget.currency)}).`);
  }
  p.updatedAt = new Date().toISOString();
  saveProjects(projects);
  renderProjectDetail();
}

function initials(name){
  return (name || '').split(' ').map(p=>p[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
}
function milestoneProgress(m){
  if(!m.tasks.length) return m.status==='TERMINE' ? 100 : 0;
  const done = m.tasks.filter(t=>t.status==='TERMINE').length;
  return Math.round((done/m.tasks.length)*100);
}

function openBudgetLineModal(projectId, lineId){
  const projects = loadProjects();
  const p = projects.find(x=>x.id===projectId);
  const line = lineId ? p.budget.lines.find(l=>l.id===lineId) : null;

  openModal({
    title: line ? 'Modifier la ligne budgétaire' : 'Nouvelle ligne budgétaire', wide:true,
    fields:[
      {name:'category', label:'Catégorie', type:'text', required:true, value:line?.category},
      {name:'description', label:'Description', type:'text', required:true, full:true, value:line?.description},
      {name:'estimated', label:'Montant estimé', type:'number', required:true, value:line ? line.estimated : 0},
    ],
    onSubmit:(v)=>{
      const projects2 = loadProjects();
      const p2 = projects2.find(x=>x.id===projectId);
      if(line){
        const target = p2.budget.lines.find(l=>l.id===lineId);
        if(p2.budget.established && (target.category!==v.category || target.description!==v.description || target.estimated!==v.estimated)){
          addBudgetJournalEntry(p2, "Modification d'une ligne budgétaire",
            `${target.category} — ${target.description} (${formatMoney(target.estimated, p2.budget.currency)}) modifiée en ${v.category} — ${v.description} (${formatMoney(v.estimated, p2.budget.currency)}).`);
        }
        Object.assign(target, v);
      } else {
        p2.budget.lines.push({id:newId(), ...v});
        if(p2.budget.established){
          addBudgetJournalEntry(p2, "Ajout d'une ligne budgétaire",
            `Nouvelle ligne ajoutée : ${v.category} — ${v.description} (${formatMoney(v.estimated, p2.budget.currency)}).`);
        }
      }
      p2.updatedAt = new Date().toISOString();
      saveProjects(projects2);
      renderProjectDetail();
    }
  });
}

function pfField({name, label, type='text', value='', options, full, rows, disabled, hint}){
  const id = `pf-${name}`;
  const dis = disabled ? 'disabled' : '';
  let input;
  if(type === 'textarea'){
    input = `<textarea id="${id}" rows="${rows||3}" ${dis}>${escapeHtml(value ?? '')}</textarea>`;
  } else if(type === 'select'){
    input = `<select id="${id}" ${dis}>${options.map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
  } else {
    input = `<input id="${id}" type="${type}" value="${escapeHtml(value ?? '')}" ${dis}>`;
  }
  return `<div class="form-field${full?' full':''}"><label>${escapeHtml(label)}</label>${input}${hint ? `<div class="field-hint">${escapeHtml(hint)}</div>` : ''}</div>`;
}

function saveProjectForm(id){
  const v = name => document.getElementById(`pf-${name}`).value;

  const name = v('name').trim();
  const code = v('code').trim();
  const startDate = v('startDate');
  const plannedEndDate = v('plannedEndDate');

  if(!name || !code || !startDate || !plannedEndDate){
    alert('Merci de renseigner au minimum le nom, le code, la date de début et la date de fin prévue.');
    return;
  }

  const projects = loadProjects();
  const now = new Date().toISOString();
  let project;
  if(id){
    project = projects.find(p=>p.id===id);
  } else {
    project = {
      id:newId(), milestones:[], risks:[], journal:[], comments:[], team:[], stakeholders:[],
      budget:{ currency:v('currency') || 'MAD', totalEstimated:0, totalActual:0, lines:[], expenses:[], established:false },
      progress:0, createdAt:now,
    };
    projects.unshift(project);
  }

  Object.assign(project, {
    name, code,
    description: v('description'),
    category: v('category'),
    status: v('status'),
    priority: v('priority'),
    healthStatus: v('healthStatus'),
    objectives: v('objectives'),
    scope: v('scope'),
    outOfScope: v('outOfScope'),
    successCriteria: v('successCriteria'),
    assumptions: v('assumptions'),
    constraints: v('constraints'),
    interProjectDependencies: v('interProjectDependencies'),
    startDate, plannedEndDate,
    actualEndDate: v('actualEndDate') || undefined,
    plannedDurationDays: parseInt(v('plannedDurationDays')) || 0,
    projectManager: v('projectManager'),
    sponsor: v('sponsor'),
    tags: v('tags').split(',').map(s=>s.trim()).filter(Boolean),
    updatedAt: now,
  });

  project.progress = computeProjectProgress(project.milestones);
  saveProjects(projects);
  viewProject(project.id);
}

  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function kpiCard(name, color, bg, value, label, alert){
  const valueColor = (alert && value>0) ? 'color:var(--boa-red);' : '';
  const borderStyle = (alert && value>0) ? 'border-color:#f5c4bf;' : '';
  return `
    <div class="card kpi-card${alert?' alert':''}" style="${borderStyle}">
      <div class="kpi-icon" style="background:${bg};">${icon(name, color)}</div>
      <div>
        <div class="kpi-value" style="${valueColor}">${value}</div>
        <div class="kpi-label">${label}</div>
      </div>
    </div>`;
}
